<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>404 - Page Not Found</title>
    <style>
      :root { color-scheme: light dark; }

      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 2rem;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <h1>404 &mdash; Page Not Found</h1>
    <p><a href="/">Back to IP Address Info</a></p>

    <script>
      "use strict";

      // GitHub Pages serves this site under /ip/, so root-absolute links here
      // resolve to the user-root site there. The Cloudflare mirror's root is /.
      if (location.hostname.endsWith("github.io")) {
        document.querySelectorAll("a[href^='/'], link[rel='icon']").forEach((el) => {
          el.setAttribute("href", "/ip" + el.getAttribute("href"));
        });
      }
    </script>
  </body>
</html>
