name: build

on:
  push:
    branches:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch (saves runner minutes on rapid pushes, e.g.
# Renovate, and gives faster feedback on the latest commit); let gh-pages runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/gh-pages' }}

env:
  JAVA_VERSION: 25
  # Single wrangler pin for validation and deploy; kept current by the
  # Renovate customManager in .github/renovate.json.
  WRANGLER_VERSION: "4.131.0"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Nu HTML Checker
        run: npm install --no-save vnu-jar

      - name: Validate HTML
        run: java -jar node_modules/vnu-jar/build/dist/vnu.jar index.html 404.html

      # Credential-less config/asset validation: proves `wrangler deploy` would succeed
      # without ever exposing the Cloudflare token to PR-triggered runs.
      - name: Validate Cloudflare config (dry run)
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --dry-run

  deploy:
    name: Deploy to Cloudflare
    needs: checks
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Serialize deploys: rapid gh-pages pushes queue instead of racing, and an in-flight
    # production upload is never cancelled.
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy
